<!DOCTYPE html>
<html>it 
<head>
    <title>Multiplication Calculator</title>
</head>
<body>

    <h2>Multiplication Calculator</h2>

    <!-- Input Fields -->
    <input type="text" id="num1" placeholder="Enter first number">
    <input type="text" id="num2" placeholder="Enter second number">

    <button onclick="multiplyNumbers()">Multiply</button>

    <p id="result"></p>

    <script>
        function multiplyNumbers() {
            const num1 = document.getElementById("num1").value;
            const num2 = document.getElementById("num2").value;

    
            if (num1 === "" || num2 === "") {
                document.getElementById("result").innerText = "Please enter both numbers.";
                return;
            }

         
            const a = parseFloat(num1);
            const b = parseFloat(num2);

        
            if (isNaN(a) || isNaN(b)) {
                document.getElementById("result").innerText = "Invalid input. Please enter valid numbers.";
                return;
            }

            const result = a * b;

            document.getElementById("result").innerText = "Result: " + result;
        }
    </script>

</body>
</html>
